# Runs on pull requests and non-main pushes: verifies the site builds and that
# formatting and generated files are up to date.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check generated stories are up to date
        run: |
          npm run generate:stories
          git diff --exit-code -- stories.html \
            || (echo "::error::stories.html is out of date. Run 'npm run generate:stories' and commit the result." && exit 1)

      - name: Build
        run: npm run build
